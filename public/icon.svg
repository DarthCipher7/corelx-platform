<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#02020a" />
  <radialGradient id="aurora" cx="30%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.8" />
    <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.4" />
    <stop offset="100%" stop-color="#02020a" stop-opacity="0" />
  </radialGradient>
  <rect width="512" height="512" rx="128" fill="url(#aurora)" />
  <g fill="none" stroke="url(#textGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <defs>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00d2ff" />
        <stop offset="50%" stop-color="#a29bfe" />
        <stop offset="100%" stop-color="#fd79a8" />
      </linearGradient>
    </defs>
  </g>
  <!-- Monogram C ✦ X -->
  <text x="130" y="320" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="190" font-weight="800" fill="#f0f0ff" letter-spacing="-10">C</text>
  <!-- Center ✦ Star -->
  <path d="M 256 180 C 256 225 240 245 205 256 C 240 267 256 287 256 332 C 256 287 272 267 307 256 C 272 245 256 225 256 180 Z" fill="#00d2ff" filter="drop-shadow(0 0 12px #00d2ff)" />
  <text x="315" y="320" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="190" font-weight="800" fill="#f0f0ff" letter-spacing="-10">X</text>
</svg>
